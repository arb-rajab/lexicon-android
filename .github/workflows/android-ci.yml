name: Android CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint-and-test:
    # Explicit names are load-bearing: main's branch protection requires these exact check
    # contexts, so changing them silently un-requires (and blocks merges on) the check.
    name: lint-and-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          # The action's default `packages` input ("tools platform-tools") includes the
          # legacy "Android SDK Tools" package, which Google has removed from the SDK
          # repository — requesting it now fails the whole step. Gradle/AGP auto-installs
          # whatever compileSdk/build-tools versions it actually needs via the accepted
          # licenses below, so platform-tools (adb et al.) is the only package to fetch here.
          packages: "platform-tools"

      - name: Gradle cache
        uses: gradle/actions/setup-gradle@v6

      # TEMPORARY - removed again before this PR merges. Investigating why
      # app/gradle.lockfile's OkHttp-5.5.0 regeneration (1c347cc) shows
      # kotlin-stdlib-jdk7/jdk8 going 1.9.10 -> 1.8.10 on the main app
      # classpaths, and androidx.annotation / androidx.startup:startup-runtime
      # resolving to two different versions across classpaths. dl.google.com
      # and repo.maven.apache.org are both unreachable from the authoring
      # sandbox, so dependencyInsight is run here instead and read from the
      # job log.
      - name: Dependency insight (temporary)
        run: |
          encode() {
            # Percent-encode for a GitHub Actions workflow-command annotation body:
            # %, CR, LF must be escaped or the command/newlines corrupt the output.
            sed -z 's/%/%25/g; s/\r/%0D/g; s/\n/%0A/g'
          }
          for cfg in debugCompileClasspath debugRuntimeClasspath; do
            for dep in \
              "org.jetbrains.kotlin:kotlin-stdlib-jdk7" \
              "org.jetbrains.kotlin:kotlin-stdlib-jdk8" \
              "androidx.annotation:annotation" \
              "androidx.startup:startup-runtime" \
              "com.squareup.okhttp3:okhttp-android"; do
              out="$(./gradlew :app:dependencyInsight --dependency "$dep" --configuration "$cfg" --no-daemon 2>&1 | grep -v '^Picked up\|^$\|^BUILD SUCCESSFUL\|^[0-9]* actionable task' || true)"
              encoded="$(printf '%s' "$out" | encode)"
              echo "::notice title=${cfg} :: ${dep}::${encoded}"
            done
          done

      - name: ktlint
        run: ./gradlew ktlintCheck --no-daemon

      - name: Unit tests
        run: ./gradlew testDebugUnitTest --no-daemon

      - name: Assemble debug APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: app/build/reports/tests/
          retention-days: 7

  # Instrumented (on-device) Compose UI tests under app/src/androidTest, run on a
  # hosted emulator. GitHub-hosted ubuntu-latest runners expose /dev/kvm (hardware
  # acceleration) once the udev rule below grants it — see
  # docs/project-memory/07-testing-strategy.md for why this was previously unverified
  # and what confirmed it's viable here.
  instrumented-tests:
    # Must render as "instrumented-tests (30)" — see the note on lint-and-test above.
    name: instrumented-tests (${{ matrix.api-level }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        api-level: [30]
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          # See the lint-and-test job's identical step for why: the action's default
          # `packages` input requests the now-removed legacy "tools" package.
          packages: "platform-tools"

      - name: Gradle cache
        uses: gradle/actions/setup-gradle@v6

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run instrumented tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          target: google_apis
          arch: x86_64
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: ./gradlew connectedDebugAndroidTest --no-daemon

      - name: Upload instrumented test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: instrumented-test-reports
          path: app/build/reports/androidTests/
          retention-days: 7
