# TEMPORARY: regenerates app/gradle.lockfile on this branch, then is deleted in the next commit.
name: Regenerate lockfile (temporary)

on:
  push:
    branches: [claude/dependabot-review-device-test-szae2d]
    paths: [".github/workflows/regen-lockfile.yml"]

permissions:
  contents: write

jobs:
  regen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools"

      - uses: gradle/actions/setup-gradle@v6

      - name: Write locks
        run: ./gradlew :app:dependencies --write-locks --no-daemon

      - name: Commit lockfile
        run: |
          git diff --stat app/gradle.lockfile
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/gradle.lockfile
          git diff --cached --quiet || git commit -m "build(deps): regenerate gradle.lockfile for OkHttp 5.5.0"
          git push
