name: TEMP lockfile generation (read-only)
on:
  push:
    branches: [claude/android-ci-security-scanning-q71ocs]
permissions:
  contents: read
jobs:
  gen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - uses: android-actions/setup-android@v3
        with: { packages: "platform-tools" }
      - uses: gradle/actions/setup-gradle@v3
      - run: ./gradlew :app:dependencies --write-locks --no-daemon > /dev/null
      - run: |
          wc -l app/gradle.lockfile
          echo "-----BEGIN LOCKFILE-----"
          cat app/gradle.lockfile
          echo "-----END LOCKFILE-----"
