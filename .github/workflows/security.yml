name: Security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly, so newly published advisories surface even when the repo is quiet.
    - cron: "17 5 * * 1"

permissions:
  contents: read

jobs:
  secret-scan:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history so leaked-then-deleted secrets are still caught.
          fetch-depth: 0

      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  codeql:
    name: CodeQL (java-kotlin)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          # See android-ci.yml: the action's default `packages` includes the removed
          # legacy "tools" package.
          packages: "platform-tools"

      - name: Gradle cache
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: java-kotlin
          build-mode: manual

      # CodeQL traces the compiler invocations made during this step to build its
      # database, so the compile tasks must actually run: --rerun-tasks and
      # --no-build-cache stop Gradle from replaying cached outputs (which would leave
      # CodeQL with nothing to observe), and --no-daemon keeps compilation inside the
      # traced process tree.
      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon --no-build-cache --rerun-tasks

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:java-kotlin"

  # CodeQL for this repo's own GitHub Actions workflows (injection via
  # untrusted event data, over-broad token permissions, unsafe checkouts).
  # A separate job so the existing CodeQL job and its required check name
  # stay unchanged; GitHub's required `CodeQL` check gates its alerts too.
  codeql-actions:
    name: CodeQL (actions)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - uses: actions/checkout@v7

      - uses: github/codeql-action/init@v4
        with:
          languages: actions
          build-mode: none

      - uses: github/codeql-action/analyze@v4
        with:
          category: "/language:actions"

  dependency-scan:
    name: Dependency scan (osv-scanner)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Scan Gradle lockfile
        uses: google/osv-scanner-action/osv-scanner-action@a345acffa64b0eaede81a3d9aae6141214d9c8fc # v2.6.0
        with:
          scan-args: |-
            --config=osv-scanner.toml
            --lockfile=app/gradle.lockfile
