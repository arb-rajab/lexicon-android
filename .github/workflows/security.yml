name: Security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly, so newly published advisories surface even when the repo is quiet.
    - cron: "17 5 * * 1"

permissions:
  contents: read

jobs:
  secret-scan:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history so leaked-then-deleted secrets are still caught.
          fetch-depth: 0

      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  codeql:
    name: CodeQL (java-kotlin)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          # See android-ci.yml: the action's default `packages` includes the removed
          # legacy "tools" package.
          packages: "platform-tools"

      - name: Gradle cache
        uses: gradle/actions/setup-gradle@v6

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: java-kotlin
          build-mode: manual

      # CodeQL traces the compiler invocations made during this step to build its
      # database, so the compile tasks must actually run: --rerun-tasks and
      # --no-build-cache stop Gradle from replaying cached outputs (which would leave
      # CodeQL with nothing to observe), and --no-daemon keeps compilation inside the
      # traced process tree.
      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon --no-build-cache --rerun-tasks

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:java-kotlin"

  dependency-scan:
    name: Dependency scan (osv-scanner)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Scan Gradle lockfile
        uses: google/osv-scanner-action/osv-scanner-action@v2.6.0
        with:
          scan-args: |-
            --config=osv-scanner.toml
            --lockfile=app/gradle.lockfile
